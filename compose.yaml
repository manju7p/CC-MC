# CC-MC local Docker Compose project - two services, one project ("cc-mc").
#
# Usage (see .env.local.example - copy it to .env.local and fill in a local
# password/secret first):
#
#   docker compose -p cc-mc --env-file .env.local config   # validate
#   docker compose -p cc-mc --env-file .env.local up -d --build
#   docker compose -p cc-mc --env-file .env.local down      # stop (keeps the named volume)
#
# This is LOCAL-ONLY. Production configuration (Neon PostgreSQL, and
# eventually Render for the API) is supplied the same way - via environment
# variables - but through .env.production, never through this file. See
# README.md "Environment Configuration" / "Docker Compose".
name: cc-mc

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cc-mc-api
    container_name: cc-mc
    ports:
      - "${API_HOST_PORT:-8081}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__CcmcDb: ${ConnectionStrings__CcmcDb:?Set ConnectionStrings__CcmcDb in .env.local (see .env.local.example)}
      Jwt__Secret: ${Jwt__Secret:?Set Jwt__Secret in .env.local (see .env.local.example)}
    depends_on:
      postgres:
        # Not just "container started" - waits for PostgreSQL to actually
        # accept connections (healthcheck below), since db.Database.Migrate()
        # runs immediately at API startup and would otherwise race a
        # not-yet-ready database.
        condition: service_healthy
    networks:
      - cc-mc-network

  postgres:
    image: postgres:16
    container_name: cc-mc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ccmc_docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local (see .env.local.example)}
      POSTGRES_DB: ${POSTGRES_DB:-ccmc_cloud_docker}
    ports:
      - "${POSTGRES_HOST_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ccmc_docker} -d ${POSTGRES_DB:-ccmc_cloud_docker}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - cc-mc-network
    volumes:
      - cc-mc-postgres-data:/var/lib/postgresql/data

networks:
  cc-mc-network:
    name: cc-mc-network

volumes:
  cc-mc-postgres-data:
    name: cc-mc-postgres-data
